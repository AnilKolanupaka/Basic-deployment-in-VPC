<!DOCTYPE html>
<html>
<head>
  <title>Cloud Status Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding-top: 50px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      margin: auto;
      width: 50%;
      border-radius: 10px;
      box-shadow: 0px 0px 10px #38bdf8;
    }
    h1 {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🚀 Cloud Status Dashboard</h1>
    <p>Frontend running on AWS EC2 inside VPC</p>

    <h3>System Info</h3>
    <p>Instance: EC2 Web Server</p>
    <p>Status: Running</p>

    <button onclick="showIP()">Show Message</button>
    <p id="msg"></p>
  </div>

  <script>
    function showIP() {
      document.getElementById("msg").innerHTML =
        "Deployed successfully inside VPC 🎉";
    }
  </script>

</body>
</html>
